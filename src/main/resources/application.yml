spring:
  ai:
    model:
      chat: ${AI_PROVIDER:google-genai}

    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.35

    google:
      genai:
        api-key: ${GOOGLE_API_KEY:}
        chat:
          model: gemini-2.5-flash
          temperature: 0.35